org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
# Heap for the Gradle daemon: CI (GitHub Actions) failed dexing with
# java.lang.OutOfMemoryError on the 512 MB default (run 42646098518).
# -Xmx4096m fits the 7 GB runner and any normal dev machine.
# NOTE: the sandbox's proxy/TLS settings live in ~/.gradle/gradle.properties
# as systemProp.* keys and still merge in — only this heap key is set here,
# and scripts/gradle.sh still regenerates the user-home file per session.
# Proxy / TLS settings for this sandbox are NOT stored in this repo.
org.gradle.jvmargs=-Xmx4096m
