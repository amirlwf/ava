org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
# NOTE: org.gradle.jvmargs (heap + proxy/TLS for this sandbox) lives in
# ~/.gradle/gradle.properties and is regenerated by scripts/gradle.sh from
# the live environment on every build — it is intentionally NOT set here,
# because a project-level value would override the user-home one.
# Proxy / TLS settings for this sandbox are NOT stored in this repo.
# scripts/gradle.sh regenerates ~/.gradle/gradle.properties from the live
# environment (rotating egress-proxy credentials) before every build.
