# Ava — CI: build the debug APK on GitHub Actions.
# The sandbox where Ava is developed cannot run Gradle (its daemon needs
# raw loopback TCP, which is blocked there), so the APK is built here.
name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0"
          # Android 17 (API 37, "Cinnamon Bun") is still in preview, so its
          # platform is NOT in the stable repository — it lives in the
          # canary channel (sdkmanager --channel=3). The current androidx
          # libraries (navigation 2.10.2, compose 1.12, core 1.19.1, ...)
          # require compileSdk 37, so CI must install it from there.
          # Accept the preview license first, then install the platform.
          yes | "$SDKMANAGER" --channel=3 --licenses
          "$SDKMANAGER" --channel=3 "platforms;android-37"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ava-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
