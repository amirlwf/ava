[versions]
# Pins verified against Maven Central / Google Maven on 2026-11-09.
# NOTE: these are intentionally NOT the latest stable versions. The newest
# androidx releases (compose BOM 2026.09.00, core-ktx 1.19.1, lifecycle
# 2.11.0, activity 1.13.0, navigation 2.10.2, coil 3.6.3) declare
# minCompileSdk 37, but Android 17 (API 37, "Cinnamon Bun") is still in
# preview — its platform is not in the stable SDK repository, not in the
# canary channel via sdkmanager, and not downloadable as a platform zip
# (verified 2026-11-09, CI runs 42647750383 / 42649719586 / 42651859291).
# So the libraries are pinned to the newest versions whose AAR metadata
# declares minCompileSdk <= 36 (each verified by downloading the AAR and
# reading META-INF/com/android/build/gradle/aar-metadata.properties):
#   core-ktx 1.18.0 = 36, activity-compose 1.12.0 = 36,
#   coil-compose-android 3.5.0 = 36, compose ui-android 1.11.4 = 35,
#   material3-android 1.4.0 = 35; lifecycle 2.10.0 / navigation-compose
#   2.9.5 AARs carry no aar-metadata.properties (no constraint).
# When platforms;android-37 reaches the stable repository, bump
# compileSdk to 37 and restore the latest versions.
agp = "9.5.1"
kotlin = "2.3.21"
ksp = "2.3.13"
composeBom = "2026.06.01"
media3 = "1.11.1"
room = "2.8.5"
datastore = "1.3.0"
navigation = "2.9.5"
coil = "3.5.0"
lifecycle = "2.10.0"
activityCompose = "1.12.0"
coreKtx = "1.18.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
